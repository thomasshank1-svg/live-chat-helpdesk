<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChatDesk</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"><script defer src="common.js"></script><script defer src="app.js"></script></head><body><header class="topbar"><div><strong>ChatDesk</strong><span>Live chat helpdesk</span></div><a href="/">Local demo</a></header><main class="shell"><section class="hero"><p class="badge">Web apps and support tooling</p><h1>Handle live support conversations from one inbox.</h1><p>Visitors can start chats, agents can reply with canned responses, and each conversation keeps a status.</p></section><section class="grid"><div class="panel"><div class="panel-title"><h2>Inbox</h2><span id="count"></span></div><div id="conversations" class="list"></div></div><aside class="panel stack"><h2>Conversation</h2><div id="messages" class="chat"></div><form id="replyForm" class="stack"><select id="canned"></select><textarea name="body" placeholder="Type a reply"></textarea><button>Send reply</button></form></aside></section><section class="panel"><h2>Start test chat</h2><form id="newForm" class="two"><label>Visitor <input name="visitor" required></label><label>Topic <input name="topic" required></label><label class="span">Message <textarea name="body" required></textarea></label><button>Start chat</button></form></section><div id="status" class="status" role="status" aria-live="polite"></div></main></body></html>
